[project]
name = "queueiq"
version = "0.1.0"
description = "Survival and competing-risks models for US grid interconnection queue outcomes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies: what the API and dashboard need to load and serve the trained model
# (this is all the Docker image installs). Exact versions live in uv.lock.
dependencies = [
    "fastapi>=0.162.4",
    "joblib>=1.6.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "scikit-survival>=0.28.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.28.1",
    "playwright>=1.65.0",
]
# Rebuilding the data and training/evaluating every model (make data/train/evaluate).
pipeline = [
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "openpyxl>=3.1.5",
]

[tool.uv]
# A plain `uv sync` (make setup) installs everything; Docker uses --no-default-groups.
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queueiq"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear,
# UP: modern syntax, SIM: simplifications, NPY: NumPy-specific rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Builds markdown report/model-card tables; wrapping those lines would break the tables.
"src/queueiq/evaluation/final.py" = ["E501"]
"src/queueiq/explain/build.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
