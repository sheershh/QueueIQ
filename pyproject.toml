[project]
name = "queueiq"
version = "0.1.0"
description = "Survival and competing-risks models for US grid interconnection queue outcomes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added phase by phase (`uv add <pkg>`), so each one
# arrives with the code that needs it. Exact versions live in uv.lock.
dependencies = [
    "joblib>=1.6.0",
    "lifelines>=0.30.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scikit-survival>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queueiq"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear,
# UP: modern syntax, SIM: simplifications, NPY: NumPy-specific rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Builds markdown report/model-card tables; wrapping those lines would break the tables.
"src/queueiq/evaluation/final.py" = ["E501"]
"src/queueiq/explain/build.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
