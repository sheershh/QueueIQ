name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install pinned dependencies
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Test
        run: make test
